<div class="col-xl-10 position-relative mt-n3 mt-xl-n9">
  <h6 class="d-none d-xl-block mb-3">Find Microfinance Options</h6>

  <form
    class="card shadow rounded-3 position-relative p-4 pe-md-5 pb-5 pb-md-4"
  >
    <div class="row g-4 align-items-center">
      <div class="col-lg-4">
        <div
          class="form-control-border form-control-transparent form-fs-md d-flex"
        >
          <i class="bi bi-geo-alt fs-3 me-2 mt-2"></i>

          <div class="flex-grow-1">
            <label class="form-label">Branch or Region</label>
            <select selectFormInput data-search-enabled="true">
              <option value="-1" disabled selected>Select branch or region</option>
              <option>Tunis, Tunisia</option>
              <option>Sousse, Tunisia</option>
              <option>Sfax, Tunisia</option>
              <option>Manouba, Tunisia</option>
              <option>Mestir, Tunisia</option>
              <option>Mahdia, Tunisia</option>
              <option>Bizerte, Tunisia</option>
              <option>Nabeul, Tunisia</option>
              <option>Gabes, Tunisia</option>
              <option>Gafsa, Tunisia</option>
              <option>Kairouan, Tunisia</option>
              <option>Kasserine, Tunisia</option>
              <option>Kebili, Tunisia</option>
              <option>Kef, Tunisia</option>
              <option>Jendouba, Tunisia</option>
              <option>Le Kef, Tunisia</option>
              <option>Siliana, Tunisia</option>
              <option>Sidi Bouzid, Tunisia</option>
              <option>Djerba, Tunisia</option>
              <option>Mednine, Tunisia</option>
              <option>Tataouine, Tunisia</option>
              <option>Tozeur, Tunisia</option>
              <option>Douz, Tunisia</option>
              <option>Beja, Tunisia</option>
            </select>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="d-flex">
          <i class="bi bi-calendar fs-3 me-2 mt-2"></i>

          <div class="form-control-border form-control-transparent form-fs-md">
            <label class="form-label">Loan Period</label>
            <input
              type="text"
              mwlFlatpickr
              [flatpickrOptions]="{ mode: 'range', dateFormat: 'd M' }"
              class="form-control flatpickr"
              placeholder="Select period"
              value="19 Sep to 28 Sep"
            />
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div
          class="form-control-border form-control-transparent form-fs-md d-flex"
        >
          <i class="bi bi-person fs-3 me-2 mt-2"></i>

          <div class="w-100">
            <label class="form-label">Applicants & Products</label>
            <div ngbDropdown class="dropdown guest-selector me-2">
              <input
                ngbDropdownToggle
                type="text"
                class="form-guest-selector form-control selection-result"
                [value]="getApplicantsValue()"
                data-bs-auto-close="outside"
                data-bs-toggle="dropdown"
              />

              <ul ngbDropdownMenu class="dropdown-menu guest-selector-dropdown">
                <li class="d-flex justify-content-between">
                  <div>
                    <h6 class="mb-0">Applicants</h6>
                    <small>Individuals or groups</small>
                  </div>

                  <div class="hstack gap-1 align-items-center">
                    <button
                      type="button"
                      class="btn btn-link adult-remove p-0 mb-0"
                      (click)="updateApplicants('individuals', false)"
                    >
                      <i class="bi bi-dash-circle fs-5 fa-fw"></i>
                    </button>
                    <h6 class="guest-selector-count mb-0 adults">
                      {{ formValue.applicants?.individuals }}
                    </h6>
                    <button
                      type="button"
                      class="btn btn-link adult-add p-0 mb-0"
                      (click)="updateApplicants('individuals')"
                    >
                      <i class="bi bi-plus-circle fs-5 fa-fw"></i>
                    </button>
                  </div>
                </li>

                <li class="dropdown-divider"></li>

                <li class="d-flex justify-content-between">
                  <div>
                    <h6 class="mb-0">Products</h6>
                    <small>Loans, savings, etc.</small>
                  </div>

                  <div class="hstack gap-1 align-items-center">
                    <button
                      type="button"
                      class="btn btn-link child-remove p-0 mb-0"
                      (click)="updateApplicants('products', false)"
                    >
                      <i class="bi bi-dash-circle fs-5 fa-fw"></i>
                    </button>
                    <h6 class="guest-selector-count mb-0 child">
                      {{ formValue.applicants?.products }}
                    </h6>
                    <button
                      type="button"
                      class="btn btn-link child-add p-0 mb-0"
                      (click)="updateApplicants('products')"
                    >
                      <i class="bi bi-plus-circle fs-5 fa-fw"></i>
                    </button>
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="btn-position-md-middle">
      <a class="icon-lg btn btn-round btn-primary mb-0" href="javascript:void()"
        ><i class="bi bi-search fa-fw"></i
      ></a>
    </div>
  </form>
</div>
