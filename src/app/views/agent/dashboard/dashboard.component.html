<section class="pt-0">
  <div class="container vstack gap-4">
    <div class="row">
      <div class="col-12">
        <h1 class="fs-4 mb-0">
          <i class="bi bi-house-door fa-fw me-1"></i>Dashboard
        </h1>
      </div>
    </div>
        <!-- Formations Section -->
        <div class="row g-4 mb-3">
          <div class="col-12">
            <div class="card border h-100">
              <div class="card-header border-bottom">
                <h5 class="card-header-title">Formations</h5>
                <a [routerLink]="['/agent/formations']" class="btn btn-sm btn-primary-soft mb-0">Voir toutes les formations</a>
              </div>
              <div class="card-body">
                <p class="mb-0">Gérez vos formations et consultez la liste complète</p>
                <div class="d-flex justify-content-end mt-3">
                  <a [routerLink]="['/agent/formations/add']" class="btn btn-sm btn-success mb-0">Ajouter une formation</a>
                </div>
              </div>
            </div>
          </div>
        </div>
    <dashboard-widget-card />

    <dashboard-booking-stats />

    <dashboard-upcoming-booking />
    

  </div>
</section>
