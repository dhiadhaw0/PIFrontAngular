<!-- Transaction Form Modal -->
<div class="modal" [class.show]="showForm" [style.display]="showForm ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div class="d-flex align-items-center">
          <i [class]="'bi ' + getTransactionIcon() + ' transaction-icon me-3'"></i>
          <h5 class="modal-title mb-0">{{getTransactionTitle()}}</h5>
        </div>
        <button type="button" class="btn-close" (click)="closeForm()"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="submit()">
          <!-- Amount with currency selection -->
          <div class="mb-4">
            <label class="form-label fw-bold">Amount</label>
            <div class="input-group">
              <select class="form-select" style="max-width: 120px;">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
              </select>
              <input type="number" class="form-control" formControlName="amount" placeholder="Enter amount">
            </div>
            <small class="text-muted mt-2 d-block">Available balance: ${{accountDetails?.balance || 0}}</small>
          </div>
          
          <!-- Description with emoji picker -->
          <div class="mb-4">
            <label class="form-label fw-bold">Description</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="bi bi-emoji-smile"></i>
              </span>
              <input type="text" class="form-control" formControlName="description" placeholder="What's this for?">
            </div>
          </div>

          <!-- Recipient Account (for transfers) -->
          <div class="mb-4" *ngIf="selectedType === 'transfer'">
            <label class="form-label fw-bold">Recipient</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="bi bi-person-circle"></i>
              </span>
              <input type="text" class="form-control" formControlName="recipientAccount" placeholder="Enter account or search contacts">
            </div>
          </div>

          <!-- Payment Method -->
          <div class="mb-4">
            <label class="form-label fw-bold">Payment Method</label>
            <div class="row g-2">
              <div class="col-6">
                <div class="form-check card p-3">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="wallet" checked>
                  <label class="form-check-label" for="wallet">
                    <i class="bi bi-wallet2 me-2"></i>Wallet
                  </label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-check card p-3">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="card">
                  <label class="form-check-label" for="card">
                    <i class="bi bi-credit-card me-2"></i>Card
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg" [disabled]="form.invalid">
              <i class="bi bi-arrow-right-circle me-2"></i>Confirm {{getTransactionTitle()}}
            </button>
            <button type="button" class="btn btn-link" (click)="closeForm()">
              Cancel Transaction
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade show" *ngIf="showForm"></div>
