<div class="row g-4">
  <div class="col-md-6 col-lg-3" *ngFor="let type of types">
    <div [class]="'card h-100 shadow transaction-card border-' + type.color" (click)="onSelect(type.id)">
      <div class="card-body text-center">
        <i [class]="type.icon + ' display-4 text-' + type.color + ' mb-3'"></i>
        <h3 class="card-title h5">{{type.title}}</h3>
        <p class="card-text text-muted">{{type.description}}</p>
      </div>
    </div>
  </div>
</div>
