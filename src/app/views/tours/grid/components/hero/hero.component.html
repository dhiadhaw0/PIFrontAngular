<section class="pt-0">
  <div class="container">
    <div class="p-3 p-sm-5 rounded-3 bg-light">
      <div class="row">
        <div class="col-md-8 mx-auto my-5 text-center">
          <h1 class="text-dark">My Courses</h1>
          <p class="lead text-muted">Welcome back! Here are the courses you are enrolled in.</p>
          <form class="d-flex justify-content-center mt-4" (submit)="$event.preventDefault()">
            <input type="text" class="form-control form-control-lg w-50 me-2" placeholder="Search your courses...">
            <button class="btn btn-primary btn-lg" type="submit">Search</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
