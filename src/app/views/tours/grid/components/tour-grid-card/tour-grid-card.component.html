<section class="pt-0">
  <div class="container">
    <div class="row g-4 align-items-center justify-content-between mb-4">
      <div class="col-12 col-xl-8">
        <h5 class="mb-0">My Enrolled Courses</h5>
      </div>
    </div>

    <div class="row g-4">
      <div *ngFor="let course of enrolledCourses" class="col-md-6 col-xl-4">
        <div class="card card-hover-shadow pb-0 h-100">
          <div class="position-relative">
            <img [src]="course.image" class="card-img-top" alt="Course image" />
            <div class="card-img-overlay d-flex flex-column p-4 z-index-1">
              <div class="w-100 mt-auto">
                <span class="badge bg-primary fs-6">{{ course.progress }}% Complete</span>
              </div>
            </div>
          </div>
          <div class="card-body px-3">
            <h5 class="card-title mb-1">{{ course.name }}</h5>
            <div class="mb-2 text-muted small">by {{ course.instructor }}</div>
            <p class="mb-2 small">{{ course.description }}</p>
            <div class="mb-2">
              <span class="fw-bold text-success">{{ currencyType }}{{ course.price }}</span>
              <span class="text-muted small ms-2">Enrolled: {{ course.enrolledDate }}</span>
            </div>
            <div class="progress mb-2" style="height: 8px;">
              <div class="progress-bar bg-success" [style.width]="course.progress + '%'"> </div>
            </div>
          </div>
          <div class="card-footer pt-0">
            <div class="d-flex justify-content-between align-items-center">
              <a [routerLink]="['/tours/progress', course.id]" class="btn btn-sm btn-primary mb-0">View Progress</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
