<div class="col-lg-6 d-flex align-items-center order-2 order-lg-1">
  <div class="p-3 p-lg-5">
    <img src="assets/images/element/signin.svg" alt="" />
  </div>

  <div class="vr opacity-1 d-none d-lg-block"></div>
</div>

<div class="col-lg-6 order-1">
  <div class="p-4 p-sm-7">
    <a routerLink="/">
      <img class="h-50px mb-4" src="assets/images/logo-icon.svg" alt="logo" />
    </a>

    <h1 class="mb-2 h3">Welcome back</h1>
    <p class="mb-0">
      New here?<a routerLink="/auth/sign-up"> Create an account</a>
    </p>

    <form
      [formGroup]="signinForm"
      (ngSubmit)="onLogin()"
      class="mt-4 text-start"
    >
      <div class="mb-3">
        <label class="form-label">Enter email id</label>
        <input
          type="email"
          formControlName="email"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['email'].errors }"
        />
        <div class="invalid-feedback">Please enter email</div>
      </div>

      <div class="mb-3 position-relative">
        <label class="form-label">Enter password</label>
        <input
          class="form-control fakepassword"
          formControlName="password"
          [type]="passwordType ? 'password' : 'text'"
          [ngClass]="{ 'is-invalid': submitted && form['password'].errors }"
          id="psw-input"
        />
        <span
          class="position-absolute top-50 end-0 translate-middle-y p-0 mt-3"
        >
          <i
            class="fakepasswordicon fas fa-eye-slash cursor-pointer p-2"
            [ngClass]="{ 'fa-eye': !passwordType }"
            (click)="changeType()"
          ></i>
        </span>
        <div class="invalid-feedback">Please enter password</div>
      </div>

      <div class="mb-3 d-sm-flex justify-content-between">
        <div>
          <input
            type="checkbox"
            class="form-check-input me-1"
            id="rememberCheck"
          />
        
        </div>
      </div>

      <div>
        <button type="submit" class="btn btn-primary w-100 mb-0">Login</button>
      </div>

     

      <div class="text-primary-hover text-body mt-3 text-center">
        Copyrights ©{{ currentYear }} Booking. Build by
        <a href="{{ creditsBy.website }}" class="text-body">{{
          creditsBy.name
        }}</a
        >.
      </div>
    </form>
  </div>
</div>
