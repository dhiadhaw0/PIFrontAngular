<div class="col-lg-6 d-md-flex align-items-center order-2 order-lg-1">
  <div class="p-3 p-lg-5">
    <img src="assets/images/element/signin.svg" alt="" />
  </div>

  <div class="vr opacity-1 d-none d-lg-block"></div>
</div>

<div class="col-lg-6 order-1">
  <div class="p-4 p-sm-6">
    <a routerLink="/">
      <img class="h-50px mb-4" src="assets/images/logo-icon.svg" alt="logo" />
    </a>

    <h1 class="mb-2 h3">Create new account</h1>
    <p class="mb-0">
      Already a member?<a routerLink="/auth/sign-in"> Log in</a>
    </p>
<!-- Le formulaire reste inchangé, assurez-vous d'avoir un champ de confirmation de mot de passe -->
<form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="mt-4 text-start">
  <div class="mb-3">
    <label class="form-label">Nom</label>
    <input type="text" formControlName="nom" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Prénom</label>
    <input type="text" formControlName="prenom" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" formControlName="email" class="form-control" />
  </div>

  <div class="mb-3 position-relative">
    <label class="form-label">Mot de passe</label>
    <input
      type="{{ fieldTextType ? 'text' : 'password' }}"
      formControlName="password"
      class="form-control"
    />
    <i class="fas fa-eye cursor-pointer position-absolute top-50 end-0 mt-3 me-2"
       (click)="changetype()"
       [ngClass]="{ 'fa-eye-slash': !fieldTextType, 'fa-eye': fieldTextType }"></i>
  </div>

  <!-- Confirmation du mot de passe -->
  <div class="mb-3">
    <label class="form-label">Confirmer le mot de passe</label>
    <input type="password" formControlName="confirmpwd" class="form-control" />
  </div>

  <div class="mb-3 w-100">
    <label class="form-label">Téléverser une photo</label>
    <input type="file" class="form-control" (change)="onFileSelected($event)" />
  </div>

  <mat-form-field appearance="fill" class="w-100 mb-3">
    <mat-label>Date de naissance</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="dateNaissance" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
  

  <div class="mb-3">
    <label class="form-label">Rôle</label>
    <select formControlName="role" class="form-select">
      <option value="CLIENT">Client</option>
      <option value="ADMIN">Admin</option>
      <option value="ENTREPRENEUR">Entrepreneur</option>
      <option value="INVESTISSEUR">Investisseur</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">CIN</label>
    <input type="number" formControlName="cin" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Adresse</label>
    <input type="text" formControlName="adresse" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Profession</label>
    <input type="text" formControlName="profession" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Salaire</label>
    <input type="number" formControlName="salaire" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Numéro de téléphone</label>
    <input type="number" formControlName="numTel" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Matricule fiscale</label>
    <input type="text" formControlName="matriculeFiscale" class="form-control" />
  </div>
      <div>
        <button type="submit" class="btn btn-primary w-100 mb-0">
          Sign up
        </button>
      </div>

     

    

      <div class="text-primary-hover text-body mt-3 text-center">
        Copyrights ©{{ currentYear }} Booking. Build by
        <a href="{{ creditsBy.website }}" class="text-body">{{
          creditsBy.name
        }}</a
        >.
      </div>
    </form>
  </div>
</div>
