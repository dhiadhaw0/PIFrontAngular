<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">Credit Application Form</h2>
            <form>
              <div class="row g-4">
                <div class="col-md-6">
                  <label class="form-label">Business Name</label>
                  <input type="text" class="form-control" placeholder="Enter your business name">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Business Type</label>
                  <select class="form-select">
                    <option value="">Select business type</option>
                    <option>LLC</option>
                    <option>Corporation</option>
                    <option>Partnership</option>
                    <option>Sole Proprietorship</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Annual Revenue</label>
                  <input type="text" class="form-control" placeholder="Enter annual revenue">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Years in Business</label>
                  <input type="number" class="form-control" placeholder="Enter years in business">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Credit Pack</label>
                  <select class="form-select">
                    <option value="">Select credit pack</option>
                    <option>Starter Pack ($10,000)</option>
                    <option>Growth Pack ($50,000)</option>
                    <option>Enterprise Pack ($100,000)</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Contact Person</label>
                  <input type="text" class="form-control" placeholder="Enter contact person name">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" placeholder="Enter email address">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" placeholder="Enter phone number">
                </div>
                <div class="col-12">
                  <label class="form-label">Additional Information</label>
                  <textarea class="form-control" rows="4" placeholder="Enter any additional information"></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms">
                    <label class="form-check-label" for="terms">
                      I agree to the terms and conditions
                    </label>
                  </div>
                </div>
                <div class="col-12 text-center">
                  <button type="submit" class="btn btn-primary btn-lg">Submit Application</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
