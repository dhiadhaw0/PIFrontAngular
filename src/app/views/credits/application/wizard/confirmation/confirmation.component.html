<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body text-center">
          <div class="mb-4">
            <i class="fas fa-check-circle text-success fa-5x"></i>
          </div>
          <h3 class="card-title mb-3">Application Submitted Successfully!</h3>
          <p class="card-text mb-4">
            Thank you for submitting your credit application. We will review your application and get back to you shortly.
            You can check the status of your application in your dashboard.
          </p>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-primary" (click)="goToDashboard()">
              Go to Dashboard
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
