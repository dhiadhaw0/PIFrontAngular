<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center">Select Your User Type</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="userTypeForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <div class="card h-100" [class.selected]="selectedType === 'CLIENT'"
                  (click)="onTypeSelect('CLIENT')">
                  <div class="card-body text-center">
                    <i class="fas fa-user fa-3x mb-3"></i>
                    <h5 class="card-title">Client</h5>
                    <p class="card-text">I am applying for a personal loan</p>
                  </div>
                </div>
              </div>
              <div class="col-md-6 mb-3">
                <div class="card h-100" [class.selected]="selectedType === 'ENTREPRENEUR'"
                  (click)="onTypeSelect('ENTREPRENEUR')">
                  <div class="card-body text-center">
                    <i class="fas fa-briefcase fa-3x mb-3"></i>
                    <h5 class="card-title">Entrepreneur</h5>
                    <p class="card-text">I am applying for a business loan</p>
                  </div>
                </div>
              </div>
            </div>

            <input type="hidden" formControlName="userType">

            <div class="text-danger mb-3" *ngIf="userTypeForm.get('userType')?.invalid && 
              userTypeForm.get('userType')?.touched">
              <small>Please select a user type</small>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="userTypeForm.invalid">
                Next Step
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
