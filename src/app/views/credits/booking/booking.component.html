<credits-booking-topbar />
<main>
  <section class="py-5">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card shadow">
            <div class="card-body p-4 p-lg-5">
              <h2 class="mb-4">Loan Application Form</h2>
              
              <form>
                <div class="row g-4">
                  <!-- Personal Information -->
                  <div class="col-12">
                    <h4 class="mb-3">Personal Information</h4>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" required>
                  </div>

                  <!-- Loan Details -->
                  <div class="col-12">
                    <h4 class="mb-3">Loan Details</h4>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Loan Type</label>
                    <select class="form-select" required>
                      <option value="">Select loan type</option>
                      <option>Personal Loan</option>
                      <option>Business Loan</option>
                      <option>Education Loan</option>
                      <option>Home Improvement</option>
                      <option>Auto Loan</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Loan Amount</label>
                    <div class="input-group">
                      <span class="input-group-text">$</span>
                      <input type="number" class="form-control" required>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Loan Term</label>
                    <select class="form-select" required>
                      <option value="">Select term</option>
                      <option>6 months</option>
                      <option>12 months</option>
                      <option>24 months</option>
                      <option>36 months</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Purpose</label>
                    <input type="text" class="form-control" required>
                  </div>

                  <!-- Employment Information -->
                  <div class="col-12">
                    <h4 class="mb-3">Employment Information</h4>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Employment Status</label>
                    <select class="form-select" required>
                      <option value="">Select status</option>
                      <option>Employed</option>
                      <option>Self-Employed</option>
                      <option>Retired</option>
                      <option>Student</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Monthly Income</label>
                    <div class="input-group">
                      <span class="input-group-text">$</span>
                      <input type="number" class="form-control" required>
                    </div>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Employer Name</label>
                    <input type="text" class="form-control" required>
                  </div>

                  <!-- Additional Information -->
                  <div class="col-12">
                    <h4 class="mb-3">Additional Information</h4>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Additional Comments</label>
                    <textarea class="form-control" rows="4"></textarea>
                  </div>

                  <!-- Terms and Conditions -->
                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="terms" required>
                      <label class="form-check-label" for="terms">
                        I agree to the terms and conditions and authorize the processing of my personal data
                      </label>
                    </div>
                  </div>

                  <!-- Submit Button -->
                  <div class="col-12">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Submit Application</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<credits-booking-footer />
