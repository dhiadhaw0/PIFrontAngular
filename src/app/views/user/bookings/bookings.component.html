<div class="bookings-container">
  <header class="bookings-header">
    <h1>Financial Education Courses</h1>
    <div class="tabs">
      <button 
        [class.active]="activeTab === 'available'"
        (click)="setActiveTab('available')"
        class="tab-btn">
        Available Courses
      </button>
      <button 
        [class.active]="activeTab === 'in_progress'"
        (click)="setActiveTab('in_progress')"
        class="tab-btn">
        In Progress
      </button>
      <button 
        [class.active]="activeTab === 'completed'"
        (click)="setActiveTab('completed')"
        class="tab-btn">
        Completed
      </button>
    </div>
  </header>

  <div class="bookings-grid">
    <div *ngFor="let formation of getFilteredFormations()" class="booking-card">
      <div class="booking-image">
        <img [src]="formation.formationFileUrl" [alt]="formation.titre">
        <div class="booking-status" [class]="formation.statutFormation.toLowerCase()">
          {{ formation.typeFormation }}
        </div>
      </div>
      
      <div class="booking-details">
        <h3>{{ formation.titre }}</h3>
        <div class="course-info">
          <span class="duration">
            <i class="fas fa-clock"></i>
            {{ formation.duree }} Hours
          </span>
          <span class="rating">
            <i class="fas fa-star"></i>
            {{ formation.noteMoyenne | number:'1.1-1' }}
          </span>
          <span class="certificate" *ngIf="formation.certificat">
            <i class="fas fa-certificate"></i>
            Certificate
          </span>
        </div>
        <p class="description">{{ formation.description }}</p>
        <div class="booking-price">
          {{ formation.prix | currency:'USD' }}
        </div>
        
        <div class="booking-actions">
          <button 
            *ngIf="formation.statutFormation === 'En_Cours'"
            class="btn-enroll"
            (click)="enrollInCourse(formation.idFormation)">
            Enroll Now
          </button>
          <button 
            *ngIf="formation.statutFormation === 'En_Cours'"
            class="btn-continue">
            Continue Learning
          </button>
          <button 
            *ngIf="formation.statutFormation === 'Complète'"
            class="btn-certificate">
            Download Certificate
          </button>
          <button class="btn-details">
            View Details
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="getFilteredFormations().length === 0" class="no-bookings">
      <i class="fas fa-graduation-cap"></i>
      <p>No {{ activeTab }} courses found</p>
    </div>
  </div>
</div>
